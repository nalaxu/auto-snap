[game]
# 当前客户端：cn_steam | cn_official | global | auto（auto = 第一个正在运行的）
# 也可用命令行 --client 或环境变量 SNAP_CLIENT 临时切换；python main.py clients 查看各客户端状态
client = "cn_official"
default_client = "cn_official"   # auto 且都没运行时用这个

# 两个国服版进程都叫 SnapCN.exe：用安装目录里的标志文件区分（Steam 渠道带 NtUniSdkSteam.dll）。
# 也可以填 install_dir 精确指定安装目录。templates_dir 放该客户端专用的界面模板，缺的按钮回落到 data/templates/ui。
[game.clients.cn_steam]
label = "国服 · Steam 渠道"
process_name = "SnapCN.exe"
steam_app_id = 2955370
require_files = ["NtUniSdkSteam.dll"]
# Unity persistentDataPath（由 SnapCN_Data/app.info 推出：NetEase / SnapCN）
data_dir = "%USERPROFILE%/AppData/LocalLow/NetEase/SnapCN"
region = "cn"
verified = true               # 10 局实战验证（2026-11-07）

[game.clients.cn_official]
label = "国服 · 官网（网易账号）"
process_name = "SnapCN.exe"   # 待官网版安装后用 tools/detect_client.py 确认
exclude_files = ["NtUniSdkSteam.dll"]
install_dir = ""              # 可选：官网版安装目录
data_dir = "%USERPROFILE%/AppData/LocalLow/NetEase/SnapCN"
templates_dir = "data/templates/ui_cn_official"
region = "cn"
verified = true               # 2026-11-07 实战验证（共享界面模板可用）

[game.clients.global]
label = "国际服 · Steam"
process_name = "SNAP.exe"
steam_app_id = 1997040
data_dir = "%USERPROFILE%/AppData/LocalLow/Second Dinner/SNAP"
states_subdir = "Standalone/States/nvprod"
templates_dir = "data/templates/ui_global"
region = "global"
verified = false

[display]
resolution = [1920, 1080]     # 建议固定窗口化分辨率

[brain]
decider = "llm"               # llm（大模型逐回合决策，含场地分析；失败/超时由规则 AI 兜底）| rule_based
snap = true                   # 允许大模型决定 Snap（加注）；规则 AI 兜底时从不 Snap
retreat = true                # 允许撤退：只在「对手刚 Snap 的回合」和「最后一回合」考虑，按大模型估计的胜率算期望方块
# retreat_win_prob = 0.5      # 可选：改用固定胜率阈值（不填 = 期望方块：p < (1 − 当前赌注/终局赌注)/2，通常 25%）

# ---------------------------------------------------------------- 大模型（多厂商）
# 密钥与地址放在项目根目录 .env（已 gitignore），参考 .env.example
[llm]
provider = "openai"           # openai（含所有兼容 OpenAI 协议的中转/厂商）| anthropic
api = "auto"                  # openai 专用：responses | chat | auto（先试 Responses，不支持则回退 Chat Completions）
api_key_env = "OPENAI_API_KEY"
base_url_env = "OPENAI_BASE_URL"
timeout_s = 60

# 中转（sup2ai）2026-11-07 起 GPT-6 全系可用。场地分析已并入逐回合决策（场地只是决策因素之一，
# 与比分、双方手牌/牌库、后续规划一起分析，减少信息传递与 token 消耗）。
# 场地分析基准（7 个截图确认场地）：gpt-6.1-sol 6/7、gpt-6-astra 6/7、gpt-6-luna 5/7、gpt-5.6-terra 4/7
[llm.tasks.decision]          # 逐回合决策（含场地分析）
model = "gpt-6.1-sol"
effort = "medium"             # 无回合计时的对局（新手局等）
effort_timed = "low"          # 有回合计时的对局：实测 sol low 中位 10.7s（medium 17s，来不及）
verbosity = "low"             # 实测（tools/bench_decision.py，18 回合）：中位 7.9→6.6s、p90 14.6→11.6s，决策质量不变
deadline_s = 40               # 无计时：最多等 40s
deadline_timed_s = 16         # 有计时 T1-T4：实测（2026-11-07，18 回合串行重放）中位 8.0s、p90 14.4s；实战偶有 12.5s 迟到
deadline_late_s = 25          # 有计时 T5 起：实战 15-20s 常见，另留一次不合法重试的余量；官方回合约 1 分钟
late_from_turn = 5
# 读到回合倒计时（内存 TurnTimer）时：大模型截止 = min(上面的截止, 剩余 − timer_reserve_s)；
# 预算 < min_llm_s 直接用规则 AI（上回合没出牌时下回合时间会极短，见 2026-11-07 b03082ae）
timer_reserve_s = 7
min_llm_s = 5
max_output_tokens = 8000
timeout_s = 45
max_retries = 0

# 一键切换：profile = "deepseek"（或环境变量 LLM_PROFILE）。2026-11-07 对比结论：不思考 1.9-3.6s 但不合法率高（费用算错），
# 思考模式中位 28-45s 赶不上回合计时，暂不推荐用于逐回合决策。详见 logs/reports/bench_decision_*.json
[llm.profiles.deepseek]
api = "chat"
api_key_env = "DEEPSEEK_API_KEY"
base_url_env = "DEEPSEEK_API_URL"
json_mode = "object"                      # DeepSeek 只支持 json_object
extra_body = { thinking = { type = "disabled" } }
[llm.profiles.deepseek.tasks.decision]
model = "deepseek-v4-pro"
effort = "off"
verbosity = ""

[llm.tasks.review]            # 赛后复盘 / 离线维护场地知识库
model = "gpt-6.1-sol"
effort = "high"
timeout_s = 300

[perception]
source = "memory"             # memory（只读内存，已验证）| screen（截图 CV/OCR，未实现）
